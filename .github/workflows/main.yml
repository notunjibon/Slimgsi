name: Android GSI Diagnostic

on:
  workflow_dispatch:
    inputs:
      a11_url:
        description: 'Android 11 GSI download URL'
        required: true
        type: string
      a16_url:
        description: 'Android 16 GSI download URL'
        required: true
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils android-sdk-libsparse-utils binutils

      - name: Download and decompress GSI images
        run: |
          cd /tmp
          
          echo "=== Downloading A11 ==="
          wget -q -O a11.xz "${{ github.event.inputs.a11_url }}"
          xz -d a11.xz
          
          echo "=== Downloading A16 ==="
          wget -q -O a16.xz "${{ github.event.inputs.a16_url }}"
          xz -d a16.xz
          
          echo "=== Decompressed images ==="
          ls -lh /tmp/a11 /tmp/a16

      - name: Extract files from .img using debugfs
        run: |
          cd /tmp
          mkdir -p a11_files a16_files
          
          echo "=== Extracting from A11.img ==="
          debugfs -R "dump /system/build.prop ./a11_files/build.prop" /tmp/a11 2>&1
          debugfs -R "dump /system/etc/init.rc ./a11_files/init.rc" /tmp/a11 2>&1
          debugfs -R "ls -p /system/lib64/hw" /tmp/a11 2>&1 | tee ./a11_files/lib64_hw_list.txt
          debugfs -R "ls -p /system/lib64" /tmp/a11 2>&1 | tee ./a11_files/lib64_list.txt
          
          echo "=== Extracting from A16.img ==="
          debugfs -R "dump /system/build.prop ./a16_files/build.prop" /tmp/a16 2>&1
          debugfs -R "dump /system/etc/init.rc ./a16_files/init.rc" /tmp/a16 2>&1
          debugfs -R "ls -p /system/lib64/hw" /tmp/a16 2>&1 | tee ./a16_files/lib64_hw_list.txt
          debugfs -R "ls -p /system/lib64" /tmp/a16 2>&1 | tee ./a16_files/lib64_list.txt
          
          echo "=== Extracted files ==="
          find ./a11_files ./a16_files -type f

      - name: Compare and generate summary
        run: |
          cd /tmp
          
          echo "=== build.prop comparison ==="
          diff -u ./a11_files/build.prop ./a16_files/build.prop || true
          
          echo ""
          echo "=== init.rc comparison ==="
          diff -u ./a11_files/init.rc ./a16_files/init.rc || true
          
          echo ""
          echo "=== /system/lib64/hw directory listing ==="
          echo "--- A11 ---"
          cat ./a11_files/lib64_hw_list.txt
          echo ""
          echo "--- A16 ---"
          cat ./a16_files/lib64_hw_list.txt
          
          echo ""
          echo "=== /system/lib64 directory listing ==="
          echo "--- A11 ---"
          head -20 ./a11_files/lib64_list.txt
          echo ""
          echo "--- A16 ---"
          head -20 ./a16_files/lib64_list.txt

name: Android GSI Diagnostic Workflow

on:
  workflow_dispatch:
    inputs:
      a11_url:
        description: 'Android 11 GSI download URL'
        required: true
        type: string
      a16_url:
        description: 'Android 16 GSI download URL'
        required: true
        type: string

jobs:
  diagnose-gsi:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y android-sdk-libsparse-utils e2fsprogs wget binutils xz-utils sudo git build-essential
          
      - name: Download Android 11 GSI
        run: |
          cd /tmp
          wget -O a11.xz '${{ inputs.a11_url }}'
          ls -lh a11.xz
          
      - name: Download Android 16 GSI
        run: |
          cd /tmp
          wget -O a16.xz '${{ inputs.a16_url }}'
          ls -lh a16.xz
          
      - name: Decompress GSI images
        run: |
          cd /tmp
          xz -d a11.xz
          xz -d a16.xz
          file a11.raw.img
          file a16.raw.img
          ls -lh a11.raw.img a16.raw.img
          
      - name: Extract and inspect Android 11 GSI
        run: |
          cd /tmp
          
          # List directory structure
          debugfs -R "ls -p /system/lib64/hw" a11.raw.img > a11_hw_libs.txt 2>/dev/null || true
          debugfs -R "ls -p /system/lib64" a11.raw.img > a11_system_libs.txt 2>/dev/null || true
          
          # Extract key files
          debugfs -R "dump /system/lib64/libsurfaceflinger.so ./libsurfaceflinger_a11.so" a11.raw.img 2>/dev/null || true
          debugfs -R "dump /system/lib64/hw/hwcomposer.default.so ./hwcomposer_a11.so" a11.raw.img 2>/dev/null || true
          debugfs -R "dump /system/lib64/hw/gralloc.default.so ./gralloc_a11.so" a11.raw.img 2>/dev/null || true
          debugfs -R "dump /system/lib64/libc.so ./libc_a11.so" a11.raw.img 2>/dev/null || true
          debugfs -R "dump /system/lib64/libEGL.so ./libEGL_a11.so" a11.raw.img 2>/dev/null || true
          
          # Extract configuration files
          debugfs -R "dump /system/build.prop ./build_a11.prop" a11.raw.img 2>/dev/null || true
          debugfs -R "dump /init.rc ./init_a11.rc" a11.raw.img 2>/dev/null || true
          debugfs -R "dump /system/etc/init/bootanim.rc ./bootanim_a11.rc" a11.raw.img 2>/dev/null || true
          
          ls -lh libsurfaceflinger_a11.so hwcomposer_a11.so build_a11.prop init_a11.rc 2>/dev/null || echo "Some A11 files not extracted"
          
      - name: Extract and inspect Android 16 GSI
        run: |
          cd /tmp
          
          # List directory structure
          debugfs -R "ls -p /system/lib64/hw" a16.raw.img > a16_hw_libs.txt 2>/dev/null || true
          debugfs -R "ls -p /system/lib64" a16.raw.img > a16_system_libs.txt 2>/dev/null || true
          
          # Extract key files
          debugfs -R "dump /system/lib64/libsurfaceflinger.so ./libsurfaceflinger_a16.so" a16.raw.img 2>/dev/null || true
          debugfs -R "dump /system/lib64/hw/hwcomposer.default.so ./hwcomposer_a16.so" a16.raw.img 2>/dev/null || true
          debugfs -R "dump /system/lib64/hw/gralloc.default.so ./gralloc_a16.so" a16.raw.img 2>/dev/null || true
          debugfs -R "dump /system/lib64/libc.so ./libc_a16.so" a16.raw.img 2>/dev/null || true
          debugfs -R "dump /system/lib64/libEGL.so ./libEGL_a16.so" a16.raw.img 2>/dev/null || true
          
          # Extract configuration files
          debugfs -R "dump /system/build.prop ./build_a16.prop" a16.raw.img 2>/dev/null || true
          debugfs -R "dump /init.rc ./init_a16.rc" a16.raw.img 2>/dev/null || true
          debugfs -R "dump /system/etc/init/bootanim.rc ./bootanim_a16.rc" a16.raw.img 2>/dev/null || true
          
          ls -lh libsurfaceflinger_a16.so hwcomposer_a16.so build_a16.prop init_a16.rc 2>/dev/null || echo "Some A16 files not extracted"
          
      - name: Compare extracted files
        run: |
          cd /tmp
          
          echo "=== Comparing build.prop ===" && diff -u build_a11.prop build_a16.prop > build_prop_diff.txt 2>&1 || true
          echo "=== Comparing init.rc ===" && diff -u init_a11.rc init_a16.rc > init_rc_diff.txt 2>&1 || true
          echo "=== Comparing bootanim.rc ===" && diff -u bootanim_a11.rc bootanim_a16.rc > bootanim_rc_diff.txt 2>&1 || true
          
          echo "=== Hardware library differences ===" && diff -u a11_hw_libs.txt a16_hw_libs.txt > hw_libs_diff.txt 2>&1 || true
          echo "=== System library differences ===" && diff -u a11_system_libs.txt a16_system_libs.txt > system_libs_diff.txt 2>&1 || true
          
          cat build_prop_diff.txt
          cat init_rc_diff.txt
          cat hw_libs_diff.txt
          
      - name: Analyze binary differences
        run: |
          cd /tmp
          
          echo "=== libsurfaceflinger.so ===" | tee binary_analysis.txt
          ( file libsurfaceflinger_a11.so && file libsurfaceflinger_a16.so ) >> binary_analysis.txt 2>&1 || echo "Files not extracted" >> binary_analysis.txt
          
          echo "" >> binary_analysis.txt
          echo "=== hwcomposer.so ===" >> binary_analysis.txt
          ( file hwcomposer_a11.so && file hwcomposer_a16.so ) >> binary_analysis.txt 2>&1 || echo "Files not extracted" >> binary_analysis.txt
          
          echo "" >> binary_analysis.txt
          echo "=== libsurfaceflinger.so A11 dependencies ===" >> binary_analysis.txt
          ( objdump -p libsurfaceflinger_a11.so 2>/dev/null | grep NEEDED ) >> binary_analysis.txt 2>&1 || echo "A11 analysis failed" >> binary_analysis.txt
          
          echo "" >> binary_analysis.txt
          echo "=== libsurfaceflinger.so A16 dependencies ===" >> binary_analysis.txt
          ( objdump -p libsurfaceflinger_a16.so 2>/dev/null | grep NEEDED ) >> binary_analysis.txt 2>&1 || echo "A16 analysis failed" >> binary_analysis.txt
          
          cat binary_analysis.txt
          
      - name: Generate comparison summary
        run: |
          cd /tmp
          
          cat > COMPARISON_SUMMARY.txt << 'EOF'
          ========================================
          ANDROID GSI DIAGNOSTIC COMPARISON
          ========================================
          
          BUILD PROPERTIES DIFFERENCES:
          ----------------------------------------
          EOF
          
          cat build_prop_diff.txt >> COMPARISON_SUMMARY.txt 2>/dev/null || echo "No differences found" >> COMPARISON_SUMMARY.txt
          
          cat >> COMPARISON_SUMMARY.txt << 'EOF'
          
          INIT.RC DIFFERENCES:
          ----------------------------------------
          EOF
          
          cat init_rc_diff.txt >> COMPARISON_SUMMARY.txt 2>/dev/null || echo "No differences found" >> COMPARISON_SUMMARY.txt
          
          cat >> COMPARISON_SUMMARY.txt << 'EOF'
          
          HARDWARE LIBRARY DIFFERENCES:
          ----------------------------------------
          EOF
          
          cat hw_libs_diff.txt >> COMPARISON_SUMMARY.txt 2>/dev/null || echo "No differences found" >> COMPARISON_SUMMARY.txt
          
          cat >> COMPARISON_SUMMARY.txt << 'EOF'
          
          SYSTEM LIBRARY DIFFERENCES:
          ----------------------------------------
          EOF
          
          cat system_libs_diff.txt >> COMPARISON_SUMMARY.txt 2>/dev/null || echo "No differences found" >> COMPARISON_SUMMARY.txt
          
          cat >> COMPARISON_SUMMARY.txt << 'EOF'
          
          BINARY ANALYSIS:
          ----------------------------------------
          EOF
          
          cat binary_analysis.txt >> COMPARISON_SUMMARY.txt 2>/dev/null || true
          
          cat COMPARISON_SUMMARY.txt

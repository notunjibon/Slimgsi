name: GSI camera fix (Android 12 GSI on Android 9 MTK vendor)

# Run from the Actions tab -> "Run workflow". Paste the links in the form.
# Output: a compressed sparse system image on a GitHub Release (download link in the run summary),
# plus camera_report.txt (what differs between the A12 and A11 GSI, camera-wise).

on:
  workflow_dispatch:
    inputs:
      a12_url:
        description: "Android 12 GSI link (.img / .img.xz / .img.gz / .zip / .7z)"
        required: true
        type: string
      a11_url:
        description: "Working Android 11 GSI link (optional, only used for the comparison report)"
        required: false
        default: ""
        type: string
      selinux_permissive:
        description: "Make mtk_hal_camera + cameraserver permissive (tests the SELinux theory, logs what would be denied)"
        type: boolean
        default: true
      shell_permissive:
        description: "Make the adb shell domain permissive so dmesg/logs/lshal are readable without root (diagnostic only)"
        type: boolean
        default: true
      camera_debug_props:
        description: "Turn on MediaTek camera HAL logging at boot"
        type: boolean
        default: true
      late_camera_restart:
        description: "Restart camerahalserver + cameraserver once boot has completed (tests a start-order problem)"
        type: boolean
        default: true
      max_size_mib:
        description: "Warn if the final raw image is bigger than this (2.56 GiB = 2621)"
        required: false
        default: "2621"
        type: string
      release_tag:
        description: "Release tag prefix"
        required: false
        default: "camfix-a12"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      A12_URL: ${{ inputs.a12_url }}
      A11_URL: ${{ inputs.a11_url }}
      SELINUX_PERMISSIVE: ${{ inputs.selinux_permissive }}
      SHELL_PERMISSIVE: ${{ inputs.shell_permissive }}
      CAMERA_DEBUG_PROPS: ${{ inputs.camera_debug_props }}
      LATE_CAMERA_RESTART: ${{ inputs.late_camera_restart }}
      MAX_SIZE_MIB: ${{ inputs.max_size_mib }}
      TAG_PREFIX: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free disk space and install tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -q
          sudo apt-get install -y -q android-sdk-libsparse-utils e2fsprogs attr xxd p7zip-full xz-utils unzip file
          df -h /

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE/work"; mkdir -p "$W"; cd "$W"
          MNT="$W/mnt"; MNT11="$W/mnt11"; mkdir -p "$MNT" "$MNT11"
          cleanup() { sudo umount "$MNT" 2>/dev/null || true; sudo umount "$MNT11" 2>/dev/null || true; }
          trap cleanup EXIT

          fetch() { curl -fL --retry 4 --retry-delay 5 -A "Mozilla/5.0" -o "$2" "$1"; }

          pick_img() {
            find "$1" -type f \( -name '*.img' -o -name '*.img.*' -o -name 'system*' \) -printf '%s %p\n' \
              | sort -nr | head -1 | cut -d' ' -f2-
          }

          # download -> raw (non-sparse) image at $2
          get_raw_image() {
            local url="$1" out="$2" tmp="$W/dl.$$"
            mkdir -p "$tmp"; fetch "$url" "$tmp/in.bin"
            local cur="$tmp/in.bin" i t
            for i in 1 2 3 4; do
              t=$(file -b "$cur")
              case "$t" in
                XZ*)    xz -dc "$cur" > "$tmp/s$i.bin"; [ "$cur" = "$tmp/in.bin" ] && rm -f "$cur"; cur="$tmp/s$i.bin" ;;
                gzip*)  gzip -dc "$cur" > "$tmp/s$i.bin"; [ "$cur" = "$tmp/in.bin" ] && rm -f "$cur"; cur="$tmp/s$i.bin" ;;
                Zip*)   mkdir -p "$tmp/z$i"; unzip -q -o "$cur" -d "$tmp/z$i"; rm -f "$cur"; cur=$(pick_img "$tmp/z$i") ;;
                7-zip*) mkdir -p "$tmp/z$i"; 7z x -y -o"$tmp/z$i" "$cur" >/dev/null; rm -f "$cur"; cur=$(pick_img "$tmp/z$i") ;;
                *) break ;;
              esac
            done
            if [ "$(head -c4 "$cur" | xxd -p)" = "3aff26ed" ]; then
              simg2img "$cur" "$out"; rm -f "$cur"
            else
              mv "$cur" "$out"
            fi
            rm -rf "$tmp"
          }

          fs_type() {
            local m
            m=$(dd if="$1" bs=1 skip=1080 count=2 2>/dev/null | xxd -p)
            [ "$m" = "53ef" ] && { echo ext4; return; }
            m=$(dd if="$1" bs=1 skip=1024 count=4 2>/dev/null | xxd -p)
            [ "$m" = "e2e1f5e0" ] && { echo erofs; return; }
            echo unknown
          }

          fsck_ok() { local rc=0; e2fsck -fy "$1" >/dev/null 2>&1 || rc=$?; [ "$rc" -lt 4 ]; }

          # the system root inside the mounted image (system-as-root layouts keep it in /system)
          sysroot() {
            if [ -f "$1/system/build.prop" ] || [ -d "$1/system/system_ext" ]; then echo "$1/system"; else echo "$1"; fi
          }

          collect_info() { # root outfile
            local r="$1" o="$2"
            set +e
            {
              echo "### build.prop"; grep -E '^ro\.(build\.(version\.(release|sdk)|id|display\.id|type)|product\.(model|name)|system\.build\.fingerprint)|^ro\.vndk|^ro\.treble' "$r/build.prop" 2>/dev/null || true
              echo; echo "### selinux dirs"
              ls -1 "$r/etc/selinux" 2>/dev/null | head -50
              echo "--- mapping (plat)";   ls -1 "$r/etc/selinux/mapping" 2>/dev/null
              echo "--- system_ext selinux"; ls -1 "$r/system_ext/etc/selinux" "$r/system_ext/etc/selinux/mapping" 2>/dev/null
              echo; echo "### vndk apex / dirs"
              ls -1 "$r/apex" 2>/dev/null | grep -i vndk || true
              ls -1d "$r"/lib/vndk-* "$r"/lib64/vndk-* 2>/dev/null || true
              echo; echo "### camera init rc files"
              grep -rli camera "$r/etc/init" "$r/system_ext/etc/init" "$r/product/etc/init" 2>/dev/null | sed "s#^$r/##" || true
              echo; echo "### cameraserver.rc"
              cat "$r/etc/init/cameraserver.rc" 2>/dev/null || true
              echo; echo "### camera lines in other rc files"
              grep -rHi camera "$r/etc/init" "$r/system_ext/etc/init" "$r/product/etc/init" 2>/dev/null | grep -v '/cameraserver.rc:' | sed "s#^$r/##" || true
              echo; echo "### camera libs (size)"
              for f in "$r"/lib/libcameraservice.so "$r"/lib64/libcameraservice.so "$r"/lib64/libcamera_client.so \
                       "$r"/lib64/libcamera_metadata.so "$r"/lib64/android.hardware.camera.provider@2.*.so \
                       "$r"/lib/android.hardware.camera.provider@2.*.so "$r"/bin/cameraserver; do
                [ -e "$f" ] && stat -c '%s %n' "$f" | sed "s#$r/##"
              done
              echo; echo "### framework vintf (camera)"
              grep -rHi -B1 -A6 camera "$r/etc/vintf" "$r/system_ext/etc/vintf" 2>/dev/null | sed "s#$r/##" | head -80 || true
              echo; echo "### phh / treble camera properties in build.prop & rc"
              grep -rHi 'phh.*camera\|camera.*phh' "$r/build.prop" "$r/etc/init" "$r/system_ext/etc/init" "$r/product/etc/init" 2>/dev/null | sed "s#^$r/##" || true
            } > "$o" 2>&1
            set -e
          }

          clone_label() { # ref new
            local l
            l=$(sudo getfattr -n security.selinux --only-values "$1" 2>/dev/null | tr -d '\0' || true)
            if [ -n "$l" ]; then sudo setfattr -n security.selinux -v "$l" "$2"; else echo "warning: could not copy SELinux label to $2"; fi
          }

          # ---------------------------------------------------------------- A12 image
          echo "::group::Download and unpack A12 GSI"
          get_raw_image "$A12_URL" "$W/a12.img"
          ls -l "$W/a12.img"
          echo "::endgroup::"

          T=$(fs_type "$W/a12.img")
          echo "Filesystem: $T"
          if [ "$T" != "ext4" ]; then
            echo "::error::This image is '$T', not ext4. Only ext4 GSIs are supported by this workflow."
            exit 1
          fi

          fsck_ok "$W/a12.img" || { echo "::error::e2fsck found unrecoverable errors in the source image"; exit 1; }
          FEATS=$(dumpe2fs -h "$W/a12.img" 2>/dev/null | grep -i '^Filesystem features' || true)
          echo "$FEATS"
          # grow first (room for the new files + un-sharing), shrink again at the end
          truncate -s +1536M "$W/a12.img"
          resize2fs "$W/a12.img" >/dev/null
          if echo "$FEATS" | grep -q 'read-only'; then tune2fs -O ^read-only "$W/a12.img" || true; fi
          if echo "$FEATS" | grep -q 'shared_blocks'; then
            e2fsck -fy -E unshare_blocks "$W/a12.img" >/dev/null 2>&1 || true
          fi
          fsck_ok "$W/a12.img" || true
          sudo mount -o loop,rw "$W/a12.img" "$MNT" || { echo "::error::could not mount the image read-write"; dumpe2fs -h "$W/a12.img" | grep -i features; exit 1; }
          R=$(sysroot "$MNT"); echo "System root: $R"
          [ -f "$R/build.prop" ] || { echo "::error::build.prop not found, unexpected image layout"; ls "$MNT"; exit 1; }

          collect_info "$R" "$W/info_a12.txt"

          # ---------------------------------------------------------------- A11 image (report only)
          if [ -n "${A11_URL}" ]; then
            echo "::group::Download and unpack A11 GSI (comparison only)"
            get_raw_image "$A11_URL" "$W/a11.img"
            T11=$(fs_type "$W/a11.img")
            if [ "$T11" = "ext4" ]; then
              sudo mount -o loop,ro "$W/a11.img" "$MNT11" 2>/dev/null || sudo mount -o loop,ro,noload "$W/a11.img" "$MNT11" || true
              if mountpoint -q "$MNT11"; then
                R11=$(sysroot "$MNT11"); collect_info "$R11" "$W/info_a11.txt"
              else echo "A11 image could not be mounted, skipping comparison"; fi
            else echo "A11 image is $T11, skipping comparison"; fi
            sudo umount "$MNT11" 2>/dev/null || true; rm -f "$W/a11.img"
            echo "::endgroup::"
          fi

          # ---------------------------------------------------------------- patches
          APPLIED=""
          CILDIR="$R/system_ext/etc/selinux"; CIL="$CILDIR/system_ext_sepolicy.cil"
          if [ "$SELINUX_PERMISSIVE" = "true" ] || [ "$SHELL_PERMISSIVE" = "true" ]; then
            if [ ! -f "$CIL" ]; then
              echo "::error::$CIL does not exist in this GSI. Creating it without the matching mapping files could break boot, so I stop here. Untick both SELinux options or use a different GSI."
              exit 1
            fi
            if ! grep -q 'CAMFIX_BEGIN' "$CIL"; then
              {
                echo ""; echo "; CAMFIX_BEGIN (diagnostic permissive domains)"
                [ "$SELINUX_PERMISSIVE" = "true" ] && { echo "(typepermissive mtk_hal_camera)"; echo "(typepermissive cameraserver)"; }
                [ "$SHELL_PERMISSIVE" = "true" ]   && echo "(typepermissive shell)"
                echo "; CAMFIX_END"
              } | sudo tee -a "$CIL" >/dev/null
            fi
            APPLIED="$APPLIED selinux-permissive($([ "$SELINUX_PERMISSIVE" = true ] && echo camera)$([ "$SHELL_PERMISSIVE" = true ] && echo ,shell))"
          fi

          if [ "$CAMERA_DEBUG_PROPS" = "true" ] || [ "$LATE_CAMERA_RESTART" = "true" ]; then
            RC="$R/system_ext/etc/init/camfix.rc"
            sudo mkdir -p "$R/system_ext/etc/init"
            {
              echo "# generated by gsi-camera-fix workflow"
              if [ "$CAMERA_DEBUG_PROPS" = "true" ]; then
                echo "on post-fs-data"
                echo "    setprop vendor.debug.camera.log 1"
                echo "    setprop persist.vendor.debug.camera.log 1"
              fi
              if [ "$LATE_CAMERA_RESTART" = "true" ]; then
                echo "on property:sys.boot_completed=1"
                echo "    restart camerahalserver"
                echo "    restart cameraserver"
              fi
            } | sudo tee "$RC" >/dev/null
            sudo chmod 644 "$RC"
            REF=$(ls "$R"/system_ext/etc/init/*.rc 2>/dev/null | grep -v camfix.rc | head -1 || true)
            [ -z "$REF" ] && REF=$(ls "$R"/etc/init/*.rc | head -1)
            clone_label "$REF" "$RC"
            sudo chown 0:0 "$RC"
            APPLIED="$APPLIED init-rc(camfix.rc)"
          fi
          echo "Applied:${APPLIED:- none}"

          # ---------------------------------------------------------------- finish image
          sync; sudo umount "$MNT"
          fsck_ok "$W/a12.img" || { echo "::error::filesystem check failed after patching"; exit 1; }
          resize2fs -M "$W/a12.img" >/dev/null
          fsck_ok "$W/a12.img" || true
          BC=$(dumpe2fs -h "$W/a12.img" 2>/dev/null | awk -F: '/^Block count/{gsub(/ /,"",$2);print $2}')
          BS=$(dumpe2fs -h "$W/a12.img" 2>/dev/null | awk -F: '/^Block size/{gsub(/ /,"",$2);print $2}')
          SIZE=$((BC*BS)); truncate -s "$SIZE" "$W/a12.img"
          SIZE_MIB=$((SIZE/1048576))
          echo "Final raw size: ${SIZE_MIB} MiB (limit ${MAX_SIZE_MIB} MiB)"
          WARN=""
          [ "$SIZE_MIB" -gt "$MAX_SIZE_MIB" ] && WARN="WARNING: image is ${SIZE_MIB} MiB, larger than ${MAX_SIZE_MIB} MiB. It will not fit your system partition; slim it first with your Slimgsi workflow."

          img2simg "$W/a12.img" "$W/system.img"
          rm -f "$W/a12.img"
          xz -T0 -6 -k "$W/system.img"
          OUT="system-a12-camfix.img.xz"; mv "$W/system.img.xz" "$W/$OUT"
          OUTSZ=$(stat -c %s "$W/$OUT")
          FILES=("$W/$OUT")
          if [ "$OUTSZ" -gt 2000000000 ]; then
            split -b 1900M -d "$W/$OUT" "$W/$OUT.part"; rm "$W/$OUT"; FILES=("$W/$OUT.part"*)
          fi

          {
            echo "GSI camera fix report"; echo "====================="
            echo "Patches applied:${APPLIED:- none}"; echo "Final raw size: ${SIZE_MIB} MiB"; [ -n "$WARN" ] && echo "$WARN"; echo
            if [ -f "$W/info_a11.txt" ]; then
              echo "################ DIFF A11 (working) vs A12 ################"; diff -u "$W/info_a11.txt" "$W/info_a12.txt" || true; echo
              echo "################ FULL A11 ################"; cat "$W/info_a11.txt"; echo
            fi
            echo "################ FULL A12 ################"; cat "$W/info_a12.txt"
          } > "$W/camera_report.txt"

          TAG="${TAG_PREFIX}-${GITHUB_RUN_ID}"
          gh release create "$TAG" "${FILES[@]}" "$W/camera_report.txt" --repo "$GITHUB_REPOSITORY" \
            --title "A12 GSI camfix $TAG" \
            --notes "Patches applied:${APPLIED:- none}. Output is a sparse system image compressed with xz: unpack, then fastboot flash system system.img."
          {
            echo "## Done"
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo ""; echo "Patches applied:${APPLIED:- none}"; echo "Final raw size: ${SIZE_MIB} MiB"
            [ -n "$WARN" ] && echo "" && echo "**$WARN**"
            [ "${#FILES[@]}" -gt 1 ] && echo "" && echo "Image was split: join with \`cat $OUT.part* > $OUT\` before unpacking."
            echo ""; echo "After flashing, open the camera, then run: \`adb logcat -b all -d > cam.txt\` and \`adb shell dmesg > dmesg.txt\`, and send both."
          } >> "$GITHUB_STEP_SUMMARY"

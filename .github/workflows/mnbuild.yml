name: Patch Android 16 GSI & Publish .xz Release

on:
  workflow_dispatch:
    inputs:
      gsi_url_android11:
        description: 'Direct download URL for working Android 11 GSI (.xz)'
        required: true
        type: string
      gsi_url_android16:
        description: 'Direct download URL for non-booting Android 16 GSI (.xz)'
        required: true
        type: string
      release_tag:
        description: 'Release Tag (e.g. v16-patched-gsi)'
        required: true
        default: 'v16-patched-gsi'

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xz-utils \
            android-sdk-libsparse-utils \
            libguestfs-tools \
            cpio \
            python3 \
            tree \
            gh

      - name: Create Workspace Directories
        run: |
          mkdir -p workspace/android11 workspace/android16 workspace/mount11 workspace/mount16 workspace/patched16

      - name: Download & Extract Android 11 GSI (Working Reference)
        run: |
          echo "Downloading Android 11 GSI..."
          curl -L --fail --retry 3 "${{ inputs.gsi_url_android11 }}" -o workspace/android11/gsi.img.xz
          unxz workspace/android11/gsi.img.xz
          if file workspace/android11/gsi.img | grep -q "sparse"; then
            simg2img workspace/android11/gsi.img workspace/android11/system_raw.img
          else
            cp workspace/android11/gsi.img workspace/android11/system_raw.img
          fi

      - name: Download & Extract Android 16 GSI (Target)
        run: |
          echo "Downloading Android 16 GSI..."
          curl -L --fail --retry 3 "${{ inputs.gsi_url_android16 }}" -o workspace/android16/gsi.img.xz
          unxz workspace/android16/gsi.img.xz
          if file workspace/android16/gsi.img | grep -q "sparse"; then
            simg2img workspace/android16/gsi.img workspace/android16/system_raw.img
          else
            cp workspace/android16/gsi.img workspace/android16/system_raw.img
          fi

      - name: Mount Extracted ext4 Images
        run: |
          sudo mount -t ext4 -o loop,ro workspace/android11/system_raw.img workspace/mount11
          sudo mount -t ext4 -o loop,ro workspace/android16/system_raw.img workspace/mount16

      - name: Patch Android 16 GSI via Python (Guaranteed Directory Creation)
        run: |
          echo "Creating writeable copy of Android 16 system image..."
          cp workspace/android16/system_raw.img workspace/android16/patched_system.img
          sudo mount -t ext4 -o loop workspace/android16/patched_system.img workspace/patched16

          # Run robust Python patcher with forced directory creation
          sudo python3 - << 'EOF'
          import os
          import shutil
          import glob

          mount11 = os.path.realpath("workspace/mount11")
          patched16 = os.path.realpath("workspace/patched16")

          # Explicitly create physical target system directories if missing
          sys_bin_16 = os.path.join(patched16, "system", "bin")
          sys_lib_16 = os.path.join(patched16, "system", "lib64")
          os.makedirs(sys_bin_16, exist_ok=True)
          os.makedirs(sys_lib_16, exist_ok=True)

          dst_bin = os.path.realpath(sys_bin_16)
          dst_lib = os.path.realpath(sys_lib_16)

          # Locate source bin and lib in Android 11
          src_bin = None
          for p in [os.path.join(mount11, "system", "bin"), os.path.join(mount11, "bin")]:
              if os.path.exists(os.path.join(p, "hwservicemanager")):
                  src_bin = p
                  break

          src_lib = None
          for p in [os.path.join(mount11, "system", "lib64"), os.path.join(mount11, "lib64")]:
              if os.path.isdir(p):
                  src_lib = p
                  break

          print(f"Source Bin: {src_bin}")
          print(f"Target Bin: {dst_bin}")

          # 1. Inject hwservicemanager
          if src_bin:
              src_file = os.path.join(src_bin, "hwservicemanager")
              dst_file = os.path.join(dst_bin, "hwservicemanager")
              if os.path.exists(src_file):
                  shutil.copy2(src_file, dst_file)
                  os.chmod(dst_file, 0o755)
                  os.chown(dst_file, 0, 0)
                  print("✅ Successfully injected hwservicemanager")
              else:
                  print("⚠️ hwservicemanager binary not found in source Android 11 bin.")
          else:
              print("⚠️ Source Bin not found.")

          # 2. Inject legacy HIDL shared libraries (*hidl*.so, libhwbinder.so)
          if src_lib:
              libs_to_copy = glob.glob(os.path.join(src_lib, "*hidl*.so")) + glob.glob(os.path.join(src_lib, "libhwbinder.so"))
              count = 0
              for lib in libs_to_copy:
                  dst_lib_file = os.path.join(dst_lib, os.path.basename(lib))
                  shutil.copy2(lib, dst_lib_file)
                  os.chmod(dst_lib_file, 0o644)
                  os.chown(dst_lib_file, 0, 0)
                  count += 1
              print(f"✅ Successfully injected {count} legacy HIDL libraries into Android 16.")
          else:
              print("⚠️ Source Library path not found.")

          EOF

          sync
          sudo umount workspace/patched16
          sudo umount workspace/mount11
          sudo umount workspace/mount16
          echo "Patching completed successfully."

      - name: Compress Patched Image to .xz Format
        run: |
          echo "Compressing patched system image to .xz (this may take a few minutes)..."
          xz -T0 -9 workspace/android16/patched_system.img
          ls -lh workspace/android16/patched_system.img.xz

      - name: Publish GitHub Release & Upload .xz Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          echo "Preparing release for tag: $TAG"

          # Delete existing tag/release if re-running
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true

          # Create release and upload .xz asset
          gh release create "$TAG" \
            workspace/android16/patched_system.img.xz \
            --title "Android 16 Patched GSI for Older Vendors ($TAG)" \
            --notes "Automated patch restoring legacy HIDL infrastructure (hwservicemanager, hidl.manager, hidl.token and companion .so libraries) to allow booting Android 16 GSI on Android 9/11 vendor partitions."
